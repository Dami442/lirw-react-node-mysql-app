version: 0.2

phases:
  install:
    runtime-versions:
      nodejs: 18
    commands:
      - echo "Installing dependencies..."
      - cd frontend && npm install
      - cd ../backend && npm install
      - cd ..

  build:
    commands:
      - echo "Building React production static assets..."
      - cd frontend && npm run build
      - cd ..

  post_build:
    commands:
      - echo "Build phase completed successfully on $(date)"

artifacts:
  files:
    - 'frontend/build/***'
    - 'backend/***'
    - 'scripts/***'
    - 'appspec.yml'
  discard-paths: no